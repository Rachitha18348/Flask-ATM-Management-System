
{% extends "base.html" %}

{% block title %}Forgot PIN{% endblock %}

{% block css %}

<link rel="stylesheet"
      href="{{ url_for('static', filename='css/forgotpin.css') }}">

{% endblock %}


{% block content %}

<div class="forgot-container">

    <div class="forgot-card">

        <!-- Header -->

        <div class="forgot-icon">
            🔒
        </div>

        <h1>Forgot PIN?</h1>

        <p class="subtitle">
            Enter your registered email to reset your PIN
        </p>


        <!-- Email Form -->

        <form method="post">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your registered email"
                required
            >


            <button type="submit">
                Send OTP
            </button>

        </form>


        <!-- Back to Login -->

        <p class="login-text">
            Remember your PIN?
            <a href="/login">Login</a>
        </p>


        <!-- Message -->

        {% if info %}

            <div class="message">
                {{ info }}
            </div>

        {% endif %}

    </div>

</div>

{% endblock %}
